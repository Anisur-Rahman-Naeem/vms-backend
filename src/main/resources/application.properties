spring.application.name=vms-backend
server.port=8080

# ===================================================================
# Database Configuration (Environment-Based)
# ===================================================================
# Credentials and host settings are injected from environment variables
# (e.g. DB_URL / SPRING_DATASOURCE_URL, DB_USERNAME, DB_PASSWORD).
# Fallback to a durable local H2 database when no external DB is configured.
# Set DB_URL to a SQL Server JDBC URL to use SQL Server instead.
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/vms_db;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=${DB_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# Spring Data JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Health & Actuator Configuration
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
